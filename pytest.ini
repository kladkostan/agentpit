[pytest]
# vendor/ holds the ctf-exchange git submodule, whose nested libs ship their own
# Python test files (e.g. solady's wake tests). Keep them out of our collection.
addopts = --ignore=vendor
log_cli = true
log_cli_level = INFO
log_cli_format =   %(levelname)s - %(asctime)s -  %(message)s
log_cli_date_format = %H:%M:%S
asyncio_mode = auto
